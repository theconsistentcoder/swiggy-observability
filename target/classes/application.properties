spring.application.name=swiggy-observability-demo

server.port=8080

# ── Actuator ──────────────────────────────────────────────
# Expose all actuator endpoints (health, metrics, prometheus, info)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ── Prometheus ────────────────────────────────────────────
# Adds application name tag to every metric
management.metrics.tags.application=${spring.application.name}

# ── Info endpoint ─────────────────────────────────────────
info.app.name=Swiggy Observability Demo
info.app.version=1.0.0
info.app.description=Spring Boot + Micrometer + Prometheus + Grafana
