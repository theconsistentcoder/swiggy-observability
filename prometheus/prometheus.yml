global:
  scrape_interval: 15s       # Pull metrics every 15 seconds
  evaluation_interval: 15s   # Evaluate alert rules every 15 seconds

# ── Alerting rules ────────────────────────────────────────────────────
rule_files:
  - "alert-rules.yml"

# ── Scrape configs ────────────────────────────────────────────────────
scrape_configs:

  # Prometheus scrapes itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape our Spring Boot app
  # /actuator/prometheus is the endpoint Micrometer exposes
  - job_name: "swiggy-spring-boot"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    # host.docker.internal — lets the Prometheus container reach your
    # Spring Boot app running on localhost outside Docker
